<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="title desc"><title id="title">Support Ticket Classifier illustration</title><desc id="desc">Sample project concept. A text classification prototype that routes sample support tickets and reports evaluation metrics.</desc><rect x="0" y="0" width="960" height="600" rx="0" fill="#eaf2e2"/><circle cx="900" cy="65" r="230" fill="#ffffff50"/><circle cx="35" cy="585" r="190" fill="#ffffff50"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#517466">CODE BRIDGE  /  PROJECT COLLECTION</text><text x="60" y="133" font-family="Arial,sans-serif" font-size="30" font-weight="600" fill="#24463f">Support Ticket Classifier</text><rect x="105" y="267" width="295" height="190" rx="16" fill="#173c2b0b"/><rect x="105" y="260" width="295" height="190" rx="16" fill="#fff"/><text x="130" y="302" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#24463f">Incoming ticket</text><text x="130" y="347" font-family="Arial,sans-serif" font-size="21" font-weight="600" fill="#24463f">&quot;I cannot sign in&quot;</text><text x="130" y="407" font-family="Arial,sans-serif" font-size="15" font-weight="600" fill="#24463f">Analyse → Classify → Route</text><path d="M417 350H555m-18-15 18 15-18 15" fill="none" stroke="#7e99bd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="590" y="232" width="265" height="250" rx="16" fill="#173c2b0b"/><rect x="590" y="225" width="265" height="250" rx="16" fill="#fff"/><text x="617" y="268" font-family="Arial,sans-serif" font-size="18" font-weight="600" fill="#24463f">Predicted category</text><rect x="620" y="310" width="150" height="34" rx="17" fill="#16876b"/><text x="636" y="333" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">ACCOUNT ACCESS</text><text x="620" y="406" font-family="Arial,sans-serif" font-size="22" font-weight="600" fill="#24463f">Confidence  96%</text><text x="60" y="558" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#517466">SAMPLE CONCEPT  •  MACHINE LEARNING</text></svg>
